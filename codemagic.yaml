workflows:
  dana-payment-receiver-v2:
    name: DANA Payment Receiver V2 - Telegram Payment Bridge
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract project source
        script: |
          set -euo pipefail

          echo "=========================================="
          echo "FIND DANA PAYMENT RECEIVER SOURCE"
          echo "=========================================="

          ZIP_FILE=""

          # Prefer the explicitly prepared complete ZIP if it exists. This avoids
          # accidentally extracting an older ZIP when several archives are uploaded.
          PREFERRED="$CM_BUILD_DIR/DanaPaymentBridge_V4_COMPLETE_DEBUG_READY.zip"
          if [ -f "$PREFERRED" ]; then
            ENTRIES="$(unzip -Z1 "$PREFERRED" 2>/dev/null || true)"
            if printf '%s\n' "$ENTRIES" | grep -Fxq "android/app/build.gradle.kts" &&
               printf '%s\n' "$ENTRIES" | grep -Fxq "android/settings.gradle.kts" &&
               printf '%s\n' "$ENTRIES" | grep -Fxq "android/app/src/main/AndroidManifest.xml"; then
              ZIP_FILE="$PREFERRED"
            fi
          fi

          if [ -z "$ZIP_FILE" ]; then
            while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              ENTRIES="$(unzip -Z1 "$f" 2>/dev/null || true)"
              if printf '%s\n' "$ENTRIES" | awk '
                $0 == "android/app/build.gradle.kts" { found_build=1 }
                $0 == "android/settings.gradle.kts" { found_settings=1 }
                $0 == "android/app/src/main/AndroidManifest.xml" { found_manifest=1 }
                END { exit !(found_build && found_settings && found_manifest) }
              '; then
                ZIP_FILE="$f"
                break
              fi
            done < <(find "$CM_BUILD_DIR" -type f -iname "*.zip" -print0)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No compatible DanaPaymentReceiver ZIP found."
            ls -lah ./*.zip 2>/dev/null || true
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          rm -rf "$CM_BUILD_DIR/_bridge_src"
          mkdir -p "$CM_BUILD_DIR/_bridge_src"
          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/_bridge_src"
          cd "$CM_BUILD_DIR"

          test -f _bridge_src/android/app/build.gradle.kts
          test -f _bridge_src/android/settings.gradle.kts
          test -f _bridge_src/android/app/src/main/AndroidManifest.xml

      - name: Validate Android project
        script: |
          set -euo pipefail
          cd _bridge_src/android
          gradle --version
          test -f app/src/main/java/com/varino/danapaymentreceiver/MainActivity.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/Prefs.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/PaymentSender.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/BootReceiver.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/ReceiverHeartbeatService.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/DanaNotificationListener.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/PaymentParser.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/WalletConnectActivity.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/DebugLogger.kt
          test -f app/src/main/java/com/varino/danapaymentreceiver/LogActivity.kt
          test -f app/src/main/res/layout/activity_main.xml
          test -f app/src/main/res/layout/activity_wallet_connect.xml

          python3 - <<'PY_VALIDATE'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          for path in root.rglob('*.xml'):
              ET.parse(path)
              print(f'XML OK: {path}')
          PY_VALIDATE

      - name: Build release APK
        script: |
          set -euo pipefail
          cd _bridge_src/android
          gradle :app:assembleRelease --no-daemon --stacktrace

          echo "Isi folder output APK:"
          ls -lh app/build/outputs/apk/release/ || true

          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Tidak ada file .apk yang dihasilkan di app/build/outputs/apk/release/"
            exit 1
          fi
          echo "APK ditemukan: $APK_PATH"
          ls -lh "$APK_PATH"

    artifacts:
      - _bridge_src/android/app/build/outputs/apk/release/*.apk
