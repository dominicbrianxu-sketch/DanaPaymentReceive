workflows:
  dana-payment-receiver-v2:
    name: DANA Payment Receiver V2 - Telegram Payment Bridge
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract project source
        script: |
          set -euo pipefail

          echo "=========================================="
          echo "FIND DANA PAYMENT RECEIVER SOURCE"
          echo "=========================================="

          SOURCE_DIR=""

          # Jika project Android langsung ada di repository.
          if [ -f "./android/app/build.gradle.kts" ]; then
            SOURCE_DIR="."
            echo "Android project found directly in repository."

          else
            # Jika project Android berada di dalam ZIP.
            #
            # JANGAN menggunakan:
            # unzip -l "$f" | grep -q ...
            #
            # karena dengan pipefail dapat menghasilkan false failure
            # akibat SIGPIPE dari unzip.

            ZIP_FILE=""

            while IFS= read -r -d '' f; do

              echo "Checking ZIP: $f"

              LIST_FILE="$(mktemp)"

              if unzip -Z1 "$f" > "$LIST_FILE" 2>/dev/null; then

                if grep -F "android/app/build.gradle.kts" "$LIST_FILE" >/dev/null 2>&1; then
                  ZIP_FILE="$f"
                  rm -f "$LIST_FILE"
                  break
                fi

              fi

              rm -f "$LIST_FILE"

            done < <(
              find . -type f \( -iname "*.zip" \) -print0
            )

            if [ -z "$ZIP_FILE" ]; then

              echo "ERROR: No compatible DanaPaymentReceiver ZIP found."

              echo "ZIP files present:"
              find . \
                -type f \
                \( -iname "*.zip" \) \
                -print \
                -exec ls -lh {} \; || true

              echo "Repository root:"
              ls -lah

              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"

            echo "ZIP content check:"
            unzip -Z1 "$ZIP_FILE" |
              grep -F "android/app/build.gradle.kts" || true

            rm -rf _bridge_src
            mkdir -p _bridge_src

            unzip -q "$ZIP_FILE" -d _bridge_src

            PROJECT_GRADLE="$(
              find _bridge_src \
                -type f \
                -path "*/android/app/build.gradle.kts" \
                -print \
                -quit
            )"

            if [ -z "$PROJECT_GRADLE" ]; then

              echo "ERROR: Android Gradle project was not found after extraction."

              find _bridge_src \
                -maxdepth 5 \
                -type f |
                sort |
                head -200

              exit 1
            fi

            SOURCE_DIR="$(
              dirname \
              "$(dirname "$PROJECT_GRADLE")"
            )"

            echo "Resolved Android project: $SOURCE_DIR"
          fi

          test -f "$SOURCE_DIR/app/build.gradle.kts"
          test -f "$SOURCE_DIR/settings.gradle.kts"
          test -f "$SOURCE_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project files:"
          ls -lah "$SOURCE_DIR"

          echo "Gradle module:"
          ls -lah "$SOURCE_DIR/app"


      - name: Validate Android project
        script: |
          set -euo pipefail

          if [ -d "_bridge_src" ]; then

            PROJECT_GRADLE="$(
              find _bridge_src \
                -type f \
                -path "*/android/app/build.gradle.kts" \
                -print \
                -quit
            )"

            PROJECT_ANDROID="${PROJECT_GRADLE%/app/build.gradle.kts}"

          else

            PROJECT_ANDROID="./android"

          fi

          if [ -z "$PROJECT_ANDROID" ] ||
             [ ! -f "$PROJECT_ANDROID/app/build.gradle.kts" ]; then

            echo "ERROR: Cannot resolve Android project directory."
            exit 1

          fi

          cd "$PROJECT_ANDROID"

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

          echo "=========================================="
          echo "VALIDATING SOURCE FILES"
          echo "=========================================="

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/MainActivity.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/Prefs.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/PaymentSender.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/BootReceiver.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/ReceiverHeartbeatService.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/DanaNotificationListener.kt

          test -f \
            app/src/main/java/com/varino/danapaymentreceiver/PaymentParser.kt

          test -f \
            app/src/main/AndroidManifest.xml

          echo "=========================================="
          echo "VALIDATING GRADLE CONFIGURATION"
          echo "=========================================="

          gradle \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            >/tmp/dana_gradle_tasks.log

          tail -80 /tmp/dana_gradle_tasks.log


      - name: Build release APK
        script: |
          set -euo pipefail

          if [ -d "_bridge_src" ]; then

            PROJECT_GRADLE="$(
              find _bridge_src \
                -type f \
                -path "*/android/app/build.gradle.kts" \
                -print \
                -quit
            )"

            PROJECT_ANDROID="${PROJECT_GRADLE%/app/build.gradle.kts}"

          else

            PROJECT_ANDROID="./android"

          fi

          cd "$PROJECT_ANDROID"

          echo "=========================================="
          echo "BUILD DANA PAYMENT RECEIVER RELEASE APK"
          echo "=========================================="

          gradle \
            :app:clean \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

          APK_PATH="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          if [ -z "$APK_PATH" ]; then

            echo "ERROR: Tidak ada file .apk yang dihasilkan."

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"


    artifacts:
      - _bridge_src/android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/release/*.apk
